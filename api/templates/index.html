<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FOMC text analyzer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main>
    <h1>FOMC text analysis</h1>
    <p>Server-side form (Jinja). JSON API: <code>POST /api/v1/analyze</code>, <code>GET /api/v1/sample</code></p>

    <form method="post" action="{{ url_for('analyze_form') }}">
      <label for="text">Document text</label>
      <textarea id="text" name="text" rows="14" placeholder="Paste document text…">{{ text or '' }}</textarea>
      <button type="submit">Analyze</button>
    </form>

    {% if result %}
    <section class="results">
      <h2>Results</h2>
      <pre>{{ result | tojson(indent=2) }}</pre>
      {% if result.wordcloud_png_base64 %}
      <h3>Word cloud</h3>
      <img alt="word cloud" src="data:image/png;base64,{{ result.wordcloud_png_base64 }}" />
      {% endif %}
    </section>
    {% endif %}
  </main>
</body>
</html>
